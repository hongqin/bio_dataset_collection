access_details: |
  Public, free, with a click-through Data Usage Policy at first download.
    - JGI Data Portal (current): https://data.jgi.doe.gov/
    - IMG/M (microbial + metagenomes): https://img.jgi.doe.gov/
    - MycoCosm (fungi): https://mycocosm.jgi.doe.gov/
    - Phytozome (plants): https://phytozome-next.jgi.doe.gov/
    - Globus and API supported for bulk transfer.
  Historical "use-restricted" pre-publication policy is being retired —
  JGI no longer produces use-restricted data in new projects; remaining
  restrictions expire at publication or set date.
size: |
  Approximate scope across JGI portals (2024+):
    - IMG/M microbial: ~100,000+ isolate bacterial/archaeal genomes
    - IMG/VR viral: >15,000,000 viral genomes and fragments (largest open
      uncultivated virus collection)
    - IMG/M metagenomes: tens of thousands of metagenome assemblies
    - MycoCosm (fungi): ~2,500+ fungal genomes (Dikarya broad coverage)
    - Phytozome (plants): ~300+ plant + algal reference genomes
    - PhycoCosm (algae): ~150+ algal genomes
  "Species" count is approximate because microbial taxa are often defined
  at the MAG/genome level rather than formal species.
last_updated: 2026
citation:
  - https://doi.org/10.1093/nar/gkt1069    # JGI Genome Portal NAR 2014
  - https://doi.org/10.1093/nar/gkae1093   # IMG NAR 2024
related_resources:
  - ena
  - ncbi_genbank
notes: |
  Premier US DOE resource for non-human, bioenergy-relevant genomics.
  Especially strong on environmental microbiomes (soil, marine, biofuel),
  fungal kingdom (MycoCosm), and plant reference genomes (Phytozome).
  Phenotypes are mostly metadata about sample environment/source.
