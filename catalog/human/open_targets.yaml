name: Open Targets Platform (incl. Open Targets Genetics)
short_id: open_targets
url: https://platform.opentargets.org/
provider: EMBL-EBI; Wellcome Sanger Institute; GSK; Sanofi; Pfizer; Bristol Myers Squibb
species:
  - Homo sapiens
taxonomy_ids:
  - 9606
research_themes:
  - drug_target_discovery
  - genomics
  - gwas
  - variant_to_function
  - drug_discovery
data_modalities:
  - target_disease_associations
  - gwas_summary_statistics
  - colocalization
  - l2g_scores         # locus-to-gene predictions
  - drug_evidence
  - tractability
access_mode:
  - public_open
access_details: |
  CC0 1.0 (public domain). No registration.
    - Web platform: https://platform.opentargets.org/
    - GraphQL API: https://api.platform.opentargets.org/
    - Bulk data (Parquet/JSON) via Google Cloud Storage and EBI FTP.
    - BigQuery public dataset: open-targets-genetics
    - AWS Open Data mirror: https://registry.opendata.aws/opentargets/
  Open Targets Genetics has been merged into the unified Open Targets
  Platform API; legacy Genetics endpoints redirect.
size: ~63k targets × ~28k diseases; aggregates 20+ public evidence sources
last_updated: 2026   # quarterly releases
citation:
  - https://doi.org/10.1093/nar/gkac1046   # NAR 2023
related_resources:
  - gwas_catalog
  - gtex
  - gnomad
notes: |
  Integrative drug-target prioritization. Locus-to-Gene (L2G) score is a
  widely cited variant-to-gene predictor. Especially useful for going from
  a GWAS locus to candidate causal genes with tissue/cell-type context.
last_verified: 2026-05-13
