notes: |
  Multi-organ, multi-donor scRNA-seq reference for healthy human tissue.
  Pair with [[human_cell_atlas]] for broader community atlases and with
  disease-specific atlases (SEA-AD for AD, others on CELLxGENE) for
  comparisons.
