access_details: |
  Open data; no registration.
    - Portal: https://tabula-sapiens-portal.ds.czbiohub.org/
    - h5ad downloads via figshare and CELLxGENE.
    - Also surfaced on CZ CELLxGENE Discover for interactive exploration.
size: |
  ~483,000 single cells from 24 tissues and organs across 14 human donors,
  spanning >400 annotated cell types. Some tissues paired with bulk RNA-seq.
  Tabula Sapiens v2 (2024) ~1.1M cells, expanded donor count and tissues.
