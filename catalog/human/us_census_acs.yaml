access_details: |
  Almost all Census data are public, with API access requiring a free key.
    - Developer portal: https://www.census.gov/data/developers.html
    - data.census.gov interactive query interface.
    - ACS 5-year and 1-year API endpoints; PUMS microdata via FTP and IPUMS.
    - TIGER/Line shapefiles: https://www.census.gov/geographies/mapping-files.html
    - SAHIE (Small Area Health Insurance Estimates) API.
  Restricted-access detailed microdata: through Federal Statistical Research
  Data Centers (FSRDCs) with project review, typically used for linked
  administrative records (e.g., SSA, IRS, NCHS).
size: ~330M US residents (Decennial); ~3.5M annual ACS housing units sampled
last_updated: 2026
citation: []
related_resources:
  - brfss
  - nchs_linked_mortality
notes: |
  Not a biomedical resource by itself, but the canonical source of:
    - population denominators for rate calculations,
    - SDOH covariates (income, education, language, housing) at tract level,
    - geocoding utilities (TIGER, Census Geocoder),
    - small-area health insurance coverage estimates.
  IPUMS USA (https://usa.ipums.org/usa/) is a widely used third-party host
  with harmonized variables across years.
last_verified: 2026-05-13
