access_details: |
  Fully open, no registration.
    - Web browser and TSV download of curated lead variants:
      https://www.ebi.ac.uk/gwas/
    - REST API (curated): https://www.ebi.ac.uk/gwas/rest/api
    - Full summary statistics (where deposited) on FTP, with dedicated API:
      https://www.ebi.ac.uk/gwas/summary-statistics/api
  Trait curation uses the Experimental Factor Ontology (EFO) for harmonization.
size: |
  >45,000 published GWAS curated; >5,000 traits (mapped to EFO);
  >85,000 full summary-statistics files deposited; ~700,000+ unique
  variant–trait associations at genome-wide significance.
  Cumulative GWAS sample sizes across deposited studies: tens of millions of
  individuals (with substantial sample overlap between studies of the same
  cohort, e.g., UK Biobank, FinnGen, BBJ).
last_updated: 2026
citation:
  - https://doi.org/10.1093/nar/gkac1010   # NAR 2023
  - https://doi.org/10.1038/s41586-024-08600-3   # standards 2024
related_resources:
  - open_targets
  - pan_ukbb
notes: |
  Canonical entry point for finding GWAS hits for any trait. Use for
  fine-mapping inputs, PRS development, Mendelian randomization, and
  cross-trait colocalization. Summary statistics deposition is now expected
  for new GWAS publications.
last_verified: 2026-05-13
