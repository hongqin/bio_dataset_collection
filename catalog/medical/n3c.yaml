name: National COVID Cohort Collaborative (N3C) Data Enclave
short_id: n3c
url: https://covid.cd2h.org/
provider: NIH NCATS (National Center for Advancing Translational Sciences)
species:
  - Homo sapiens
taxonomy_ids:
  - 9606
research_themes:
  - clinical_ehr
  - covid_19
  - long_covid
  - pandemic_response
  - multi_institution_clinical
data_modalities:
  - ehr                  # OMOP common data model
