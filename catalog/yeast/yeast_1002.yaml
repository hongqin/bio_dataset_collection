access_details: |
  Open data; genomes available on the project site, ENA/SRA (PRJEB13017),
  and CNGBdb (mirror).
    - Project site: http://1002genomes.u-strasbg.fr/
    - ENA bioproject: https://www.ebi.ac.uk/ena/browser/view/PRJEB13017
    - CNGBdb mirror: https://db.cngb.org/data_resources/project/PRJEB13017
size: |
  1,011 natural Saccharomyces cerevisiae isolates from ~21 ecological /
  geographic niches sequenced to high coverage; high-throughput phenotyping
  on hundreds of growth conditions. (1,026 genomes obtained in total.)
counts:
  individuals: 1011            # strains
  individuals_total: 1026
  species: 1
last_updated: 2018
citation:
  - https://doi.org/10.1038/s41586-018-0030-5   # Peter et al., Nature 2018
related_resources:
  - sgd
notes: |
  Population-scale catalog of natural yeast variation — analogous to the
  1001 Genomes Project for Arabidopsis. Enables yeast GWAS for growth,
  drug resistance, and metabolic traits.
