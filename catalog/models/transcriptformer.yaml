notes: |
  CZI's flagship cross-species cell-biology foundation model — the
  broadest evolutionary span of any single-cell foundation model to
  date. Generative; supports cross-species cell-type alignment, virtual
  perturbation, and disease-state inference. Designed to complement
  [[uce]] (also cross-species but encoder-only).
