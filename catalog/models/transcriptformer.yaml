access_details: |
  Open weights and code.
    - Virtual Cells Platform: https://virtualcellmodels.cziscience.com/model/transcriptformer
    - GitHub: https://github.com/czi-ai/transcriptformer
    - Pretrained checkpoints for both TF-Metazoa and TF-Exemplar variants.
size: |
  Two main variants:
    - TF-Metazoa: 112M cells across 12 species — human, mouse, rabbit,
      chicken, African clawed frog, zebrafish, sea urchin, C. elegans,
      fruit fly, freshwater sponge, yeast, malaria parasite.
    - TF-Exemplar: 110M cells from 5 species (human, mouse, zebrafish,
      fruit fly, C. elegans).
  Human (57M) + mouse (27M) data drawn primarily from CZ CELLxGENE
  Census; 67M healthy + 17M diseased cells across 123 disease contexts.
counts:
