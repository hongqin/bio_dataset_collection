access_details: |
  Open data; no registration.
    - Tabula Muris portal: https://tabula-muris.ds.czbiohub.org/
    - Tabula Muris Senis (aging) portal: https://tabula-muris-senis.ds.czbiohub.org/
    - h5ad downloads via figshare; also on CZ CELLxGENE Discover.
size: |
  Tabula Muris: ~100,000 cells from 20 organs/tissues of young adult mice
  (~3 months).
  Tabula Muris Senis: extended atlas — ~529,000 cells from 23 tissues
  across multiple ages (1, 3, 18, 21, 24, 30 months) for aging research.
counts:
  cells: 100000
