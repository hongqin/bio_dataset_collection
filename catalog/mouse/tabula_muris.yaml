  tissues: 23
  age_groups_senis: 6
last_updated: 2020     # Senis publication
citation:
  - https://doi.org/10.1038/s41586-018-0590-4   # Tabula Muris, Nature 2018
  - https://doi.org/10.1038/s41586-020-2496-1   # Tabula Muris Senis, Nature 2020
related_resources:
  - tabula_sapiens
  - cellxgene_census
  - mgi
notes: |
  Multi-organ scRNA-seq reference for mouse; the Senis (aging) extension
  is uniquely valuable for geroscience — directly aligns with [[mpd]] /
  [[impc]] for aging-related quantitative phenotypes. Mouse counterpart
  to [[tabula_sapiens]].
