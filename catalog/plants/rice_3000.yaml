name: 3000 Rice Genomes Project (3K RGP) / SNP-Seek
short_id: rice_3000
url: https://iric.irri.org/projects/3000-rice-genomes-project
provider: International Rice Research Institute (IRRI); Chinese Academy of Agricultural Sciences; BGI
species:
  - Oryza sativa
taxonomy_ids:
