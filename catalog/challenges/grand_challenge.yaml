notes: |
  Where DREAM is umbrella across all of biomedicine, Grand Challenge is
  the specialty venue for MEDICAL-IMAGING competitions with
  containerized scoring. Many TCIA collections appear as Grand
  Challenge training sets after curation. Strong leaderboard culture
  with reproducible Docker submissions.
