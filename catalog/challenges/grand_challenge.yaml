access_details: |
  Free account required to download challenge data and submit predictions.
  Each challenge has its own page with dataset description, license, and
  containerized evaluation pipeline. Submissions are automatically
  scored on a held-out test set and ranked on a live leaderboard.
size: |
  Hundreds of challenges and benchmark datasets across radiology and
  digital pathology. Long-running flagship challenges include BraTS
  (brain tumor segmentation), KiTS (kidney tumors), LiTS (liver tumors),
  Learn2Reg (image registration, 10+ public sub-tasks built on OpenBHB
  T1w MRI), PANORAMA (~3,000 prostate cases), PANTHER (489 pancreas
  MRIs + 84 MR-linac), MitoEM (mitochondria in EM), Deep-PSMA (PET).
counts:
  challenges: 300            # approximate; grand-challenge.org listing
