data_modalities:
  - wgs                # low-pass WGS / genotyping by sequencing (Foundation cohort)
  - bulk_rnaseq        # Precision cohort
  - metabolomics       # Precision cohort
  - microbiome_shotgun # Precision cohort (gut microbiome)
  - ehr                # veterinary electronic medical records
