name: Dog Aging Project
short_id: dog_aging_project
url: https://dogagingproject.org/data-access
provider: University of Washington & Texas A&M (NIA-funded); data hosted on Terra at the Broad Institute
species:
  - Canis lupus familiaris
taxonomy_ids:
  - 9615
research_themes:
  - geroscience
  - genomics
