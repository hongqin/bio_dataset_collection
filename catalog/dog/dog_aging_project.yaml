access_mode:
  - tiered
  - usage_agreement
access_details: |
  Two tracks:
    1. Curated open-access data — researchers (academic, nonprofit,
       government, educators, journalists, members of the public) apply at
       https://dogagingproject.org/data-access, sign an individual Data Use
       Agreement, and download via the DAP data repository on Terra at the
       Broad Institute (https://data.dogagingproject.org/).
    2. Restricted variables (e.g., precise geolocation, identifiable
       owner-linked fields) require an additional approval step.
  No human-subjects IRB needed (canine subjects); institutional sign-off on
  the DUA is typical. Curated data are de-identified and released annually.
size: ~50,000 dogs enrolled overall (47,444 with completed surveys 2020–2023); Precision cohort ~1,000 dogs with deep multi-omics; TRIAD rapamycin sub-trial target N = 580 (~180 enrolled as of late 2024)
last_updated: 2025
citation:
  - https://doi.org/10.1038/s41586-021-04282-9   # Nature 2022 — open science study
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC12397037/   # Precision cohort design
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC9716607/    # DAP Biobank
related_resources: []
notes: |
  Open-data, community-science longitudinal study of canine aging as a
  translational model for human geroscience. Includes the TRIAD sub-trial
  of rapamycin in companion dogs. Foundation cohort provides cheek-swab
  DNA for genotyping by sequencing; Precision cohort adds longitudinal
  multi-omics. Data distributed via Terra cloud platform.
